<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1021"><title>FinRoad · Финансы под звёздами</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"></head>
<body>
  <div class="night" aria-hidden="true"><div class="stars"></div><div class="aurora"></div><div class="sky-sun"></div><div class="clouds"></div><div class="mountain mountain-back"></div><div class="mountain mountain-front"></div></div>
  <div class="shell compact-shell">
    <header class="terminal-header"><div class="brand"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Включить дневной режим" aria-pressed="false" title="Включить дневной режим"><svg class="theme-moon" viewBox="3 -0.5 32 32" aria-hidden="true"><path d="M21 4a12 12 0 1 0 7 21A14 14 0 0 1 21 4Z" fill="currentColor"/><path d="m25 3 1.2 3.8L30 8l-3.8 1.2L25 13l-1.2-3.8L20 8l3.8-1.2Z" fill="#99dfc8"/></svg><svg class="theme-sun" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6" fill="currentColor"/><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button id="header-balance" class="header-balance" type="button" data-action="balance" aria-label="Изменить текущий остаток"></button></div><nav id="navigation" aria-label="Разделы"></nav><div id="header-debt" class="header-debt" aria-live="polite"></div><div id="header-forecast" aria-live="polite"></div><div class="header-right"><span id="current-date"></span></div></header>
    <main><span id="page-name" hidden></span><div id="app" aria-live="polite"><p>Открываем данные…</p></div></main>
  </div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-heading"><div><div class="eyebrow" id="dialog-eyebrow">ТВОЙ ПЛАН</div><h2 id="dialog-title"></h2></div><button type="button" class="icon-button" id="close-dialog" aria-label="Закрыть">×</button></div><div id="dialog-fields"></div><p class="form-error" id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button danger" id="delete-dialog" hidden>Удалить</button><button type="button" class="button subtle" id="cancel-dialog">Отмена</button><button type="submit" class="button primary" id="submit-dialog">Сохранить</button></div></form></dialog>
  <div id="toast" role="status"></div><input id="import-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="/app.js"></script>
</body></html>
